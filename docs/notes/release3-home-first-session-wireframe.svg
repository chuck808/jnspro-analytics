<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820"><rect width="900" height="820" fill="#0b0c0f"/><text x="70" y="80" fill="#f4f5f7" font-family="Arial" font-size="38" font-weight="700">Home</text><text x="70" y="112" fill="#9ba3ad" font-family="Arial" font-size="17">Your gate-start training, right now.</text><rect x="70" y="160" width="760" height="330" rx="20" fill="#171a20" stroke="#303640"/><text x="100" y="207" fill="#f5a623" font-family="Arial" font-size="13" font-weight="700">FIRST SESSION</text><text x="100" y="260" fill="#f4f5f7" font-family="Arial" font-size="30" font-weight="700">Your gate-start evidence starts here</text><text x="100" y="308" fill="#c8cdd4" font-family="Arial" font-size="17">Record or upload your first gate-start session. JNSPRO will preserve</text><text x="100" y="337" fill="#c8cdd4" font-family="Arial" font-size="17">the starts, check the evidence quality, and build your training history.</text><rect x="100" y="385" width="180" height="52" rx="10" fill="#f5a623"/><text x="126" y="418" fill="#0a0809" font-family="Arial" font-size="16" font-weight="700">Upload a session</text><text x="70" y="550" fill="#9ba3ad" font-family="Arial" font-size="13" font-weight="700">WHAT BUILDS OVER TIME</text><rect x="70" y="580" width="235" height="145" rx="16" fill="#171a20" stroke="#303640"/><text x="95" y="620" fill="#f4f5f7" font-family="Arial" font-size="20" font-weight="700">Sessions</text><text x="95" y="654" fill="#c8cdd4" font-family="Arial" font-size="14">Understand each</text><text x="95" y="676" fill="#c8cdd4" font-family="Arial" font-size="14">training set.</text><rect x="333" y="580" width="235" height="145" rx="16" fill="#171a20" stroke="#303640"/><text x="358" y="620" fill="#f4f5f7" font-family="Arial" font-size="20" font-weight="700">Progress</text><text x="358" y="654" fill="#c8cdd4" font-family="Arial" font-size="14">See development when</text><text x="358" y="676" fill="#c8cdd4" font-family="Arial" font-size="14">evidence supports it.</text><rect x="595" y="580" width="235" height="145" rx="16" fill="#171a20" stroke="#303640"/><text x="620" y="620" fill="#f4f5f7" font-family="Arial" font-size="20" font-weight="700">Goals</text><text x="620" y="654" fill="#c8cdd4" font-family="Arial" font-size="14">Measure evidence against</text><text x="620" y="676" fill="#c8cdd4" font-family="Arial" font-size="14">targets you choose.</text><text x="70" y="780" fill="#68717c" font-family="Arial" font-size="12">No zero-valued performance cards · no empty longitudinal charts.</text></svg>