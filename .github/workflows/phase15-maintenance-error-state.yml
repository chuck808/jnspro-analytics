name: Phase 15 maintenance error state

on:
  push:
    branches:
      - phase15-release-hardening-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit

      - name: Harden maintenance action failure states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/(protected)/(admin)/admin/maintenance/+page.svelte')
          text = path.read_text()

          old_state = "\tlet showCreateForm = $state(false);\n\tlet isSubmitting = $state(false);\n"
          new_state = "\tlet showCreateForm = $state(false);\n\tlet isSubmitting = $state(false);\n\tlet actionError = $state<string | null>(null);\n"
          if text.count(old_state) != 1:
              raise SystemExit('maintenance state anchor not found exactly once')
          text = text.replace(old_state, new_state)

          start = text.index('\tasync function handleSubmit(e: Event) {')
          end = text.index('\n</script>', start)
          old_functions = text[start:end]
          new_functions = '''\tasync function handleSubmit(e: Event) {
\t\te.preventDefault();
\t\tisSubmitting = true;
\t\tactionError = null;

\t\ttry {
\t\t\tconst response = await fetch('/api/admin/maintenance', {
\t\t\t\tmethod: 'POST',
\t\t\t\theaders: { 'Content-Type': 'application/json' },
\t\t\t\tbody: JSON.stringify(formData)
\t\t\t});

\t\t\tif (!response.ok) throw new Error(`Maintenance create failed: ${response.status}`);

\t\t\tshowCreateForm = false;
\t\t\tformData = { title: '', description: '', start_time: '', end_time: '' };
\t\t\tawait invalidate('admin:maintenance');
\t\t} catch (error) {
\t\t\tconsole.error('Error scheduling maintenance:', error);
\t\t\tactionError = 'Could not schedule maintenance. Please try again.';
\t\t} finally {
\t\t\tisSubmitting = false;
\t\t}
\t}

\tasync function toggleSchedule(id: string, currentStatus: boolean) {
\t\tactionError = null;
\t\ttry {
\t\t\tconst response = await fetch('/api/admin/maintenance', {
\t\t\t\tmethod: 'PATCH',
\t\t\t\theaders: { 'Content-Type': 'application/json' },
\t\t\t\tbody: JSON.stringify({ id, is_active: !currentStatus })
\t\t\t});

\t\t\tif (!response.ok) throw new Error(`Maintenance update failed: ${response.status}`);
\t\t\tawait invalidate('admin:maintenance');
\t\t} catch (error) {
\t\t\tconsole.error('Error updating maintenance schedule:', error);
\t\t\tactionError = 'Could not update the maintenance schedule. Please try again.';
\t\t}
\t}

\tasync function deleteSchedule(id: string) {
\t\tif (!confirm('Are you sure you want to delete this maintenance schedule?')) return;

\t\tactionError = null;
\t\ttry {
\t\t\tconst response = await fetch('/api/admin/maintenance', {
\t\t\t\tmethod: 'DELETE',
\t\t\t\theaders: { 'Content-Type': 'application/json' },
\t\t\t\tbody: JSON.stringify({ id })
\t\t\t});

\t\t\tif (!response.ok) throw new Error(`Maintenance delete failed: ${response.status}`);
\t\t\tawait invalidate('admin:maintenance');
\t\t} catch (error) {
\t\t\tconsole.error('Error deleting maintenance schedule:', error);
\t\t\tactionError = 'Could not delete the maintenance schedule. Please try again.';
\t\t}
\t}
'''
          text = text[:start] + new_functions + text[end:]

          header_anchor = '''\t</div>\n\n\t<!-- Create Form -->'''
          error_block = '''\t</div>\n\n\t{#if actionError}\n\t\t<div\n\t\t\trole="alert"\n\t\t\tclass="rounded-lg border border-[#ff4444]/30 bg-[#ff4444]/10 px-4 py-3 text-sm text-[#ff7777]"\n\t\t>\n\t\t\t{actionError}\n\t\t</div>\n\t{/if}\n\n\t<!-- Create Form -->'''
          if text.count(header_anchor) != 1:
              raise SystemExit(f'header anchor count: {text.count(header_anchor)}')
          text = text.replace(header_anchor, error_block)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit maintenance hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/(protected)/(admin)/admin/maintenance/+page.svelte'
          git commit -m 'fix: surface maintenance action failures'
          git push origin HEAD:phase15-release-hardening-audit
