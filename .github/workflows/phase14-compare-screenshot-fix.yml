name: Phase 14 compare screenshot fix

on:
  push:
    branches:
      - phase14-help-public-audit

permissions:
  contents: write

jobs:
  remove-stale-screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-help-public-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove stale Compare screenshot reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/chapters/appgatepro_leaderboard_chapter.md')
          text = path.read_text()
          old = '\n![Compare page](/docs/leaderboard-page.png)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Compare screenshot reference, found {text.count(old)}')
          path.write_text(text.replace(old, '\n'))
          PY
          git diff --check

      - name: Regenerate docs bundle
        run: |
          python -m pip install 'Markdown==3.8.2'
          python scripts/generate-docs.py

      - name: Commit source and generated docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chapters/appgatepro_leaderboard_chapter.md src/lib/docs/contents.ts
          git commit -m 'docs: remove stale Compare screenshot'
          git push origin HEAD:phase14-help-public-audit
