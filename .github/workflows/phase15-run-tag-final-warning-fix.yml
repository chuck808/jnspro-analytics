name: Phase 15 run tag final warning fix

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-run-tag-final-warning-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Attach Escape handling to focusable controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/RunTagSelector.svelte')
          text = path.read_text()
          replacements = [
              ('\n\t\t\t\taction="?/updateRunTags"\n\t\t\t\tonkeydown={handleEscape}\n', '\n\t\t\t\taction="?/updateRunTags"\n', 'form listener'),
              ('\t\t\t\t\t\t\t\tchecked={isSelected}\n\t\t\t\t\t\t\t\tonchange={() => toggleTag(option.value)}\n', '\t\t\t\t\t\t\t\tchecked={isSelected}\n\t\t\t\t\t\t\t\tonkeydown={handleEscape}\n\t\t\t\t\t\t\t\tonchange={() => toggleTag(option.value)}\n', 'checkbox listener'),
              ('\t\t\t\t\t<button type="button" onclick={close} class="cancel-button" disabled={saving}>', '\t\t\t\t\t<button type="button" onclick={close} onkeydown={handleEscape} class="cancel-button" disabled={saving}>', 'cancel listener'),
              ('\t\t\t\t\t<button type="submit" class="save-button" disabled={!hasChanges || saving}>', '\t\t\t\t\t<button type="submit" onkeydown={handleEscape} class="save-button" disabled={!hasChanges || saving}>', 'save listener'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/RunTagSelector.svelte
          git diff --cached --check
          git commit -m "fix: keep run tag Escape handlers interactive"
          git push origin HEAD:phase15-release-hardening-audit
