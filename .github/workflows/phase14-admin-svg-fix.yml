name: Phase 14 admin SVG fix

on:
  push:
    branches:
      - phase14-help-public-audit

permissions:
  contents: write

jobs:
  patch-admin-icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-help-public-audit

      - name: Replace malformed Avg Sessions/User path only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/(protected)/(admin)/admin/+page.svelte')
          text = path.read_text()
          old = "M9 19v-6a2 2 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          new = "M4 19V10m5 9V5m5 14v-7m5 7V8"
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed path, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit isolated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/(protected)/(admin)/admin/+page.svelte'
          git commit -m 'fix: repair admin average sessions icon'
          git push origin HEAD:phase14-help-public-audit
