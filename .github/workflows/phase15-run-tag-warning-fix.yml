name: Phase 15 run tag warning fix

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-run-tag-warning-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Move Escape handlers to interactive elements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/RunTagSelector.svelte')
          text = path.read_text()
          old_wrapper = '''\t\t<div
\t\t\tid="run-tags-{runId}"
\t\t\tclass="dropdown-menu"
\t\t\trole="group"
\t\t\taria-labelledby="run-tags-title-{runId}"
\t\t\tonkeydown={handleEscape}
\t\t>'''
          new_wrapper = '\t\t<div id="run-tags-{runId}" class="dropdown-menu">'
          old_heading = '\t\t\t\t<h4 id="run-tags-title-{runId}">Tag Run {runNumber}</h4>'
          new_heading = '\t\t\t\t<h4>Tag Run {runNumber}</h4>'
          old_close = '\t\t\t\t<button type="button" onclick={close} class="close-button" aria-label="Close"> ✕ </button>'
          new_close = '\t\t\t\t<button type="button" onclick={close} onkeydown={handleEscape} class="close-button" aria-label="Close"> ✕ </button>'
          old_form = '''\t\t\t<form
\t\t\t\tmethod="POST"
\t\t\t\taction="?/updateRunTags"'''
          new_form = '''\t\t\t<form
\t\t\t\tmethod="POST"
\t\t\t\taction="?/updateRunTags"
\t\t\t\tonkeydown={handleEscape}'''
          for old, new, label in [
              (old_wrapper, new_wrapper, 'dropdown wrapper'),
              (old_heading, new_heading, 'heading'),
              (old_close, new_close, 'close button'),
              (old_form, new_form, 'form'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one {label} match, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/RunTagSelector.svelte
          git diff --cached --check
          git commit -m "fix: clear run tag keyboard warning"
          git push origin HEAD:phase15-release-hardening-audit
