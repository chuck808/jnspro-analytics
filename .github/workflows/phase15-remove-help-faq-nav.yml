name: Phase 15 remove obsolete Help FAQ nav

on:
  push:
    branches:
      - phase15-release-hardening-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit

      - name: Remove obsolete Help FAQ admin navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/components/Sidebar.svelte')
          text = path.read_text()
          old = "\t\t\t\t{ label: 'Help FAQs', href: '/admin/help-faqs', icon: icons.help },\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one Help FAQs nav item, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
          git diff --check

      - name: Commit navigation cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/components/Sidebar.svelte
          git commit -m 'chore: remove obsolete Help FAQ admin navigation'
          git push origin HEAD:phase15-release-hardening-audit
