name: Phase 15 roadmap final status

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-roadmap-final-status.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Update durable roadmap phase status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/RENOVATION_ROADMAP.md')
          text = path.read_text()
          replacements = [
              ('## Release 2 — Make It Feel Like One Product — IN PROGRESS', '## Release 2 — Make It Feel Like One Product — FINAL VERIFICATION', 'release status'),
              ('Known seam: Admin -> Feedback currently points to `/feedback`, which is outside `/admin`, so path-based workspace detection returns to the Rider shell. Decide what that page actually is before changing the route/workspace model.', 'Resolved later: `/feedback` is intentionally retained as a lightweight 308 compatibility redirect to `/admin/feedback`; the Admin workspace owns the live feedback UI.', 'feedback seam'),
              ('### Phase 5 — Single-session Overview — IN PROGRESS', '### Phase 5 — Single-session Overview — DONE', 'phase 5 status'),
              ('\nNext exact starting point after this slice passes checks: verify ordinary/PB/no-speed/exclusion/mobile rendering again, then decide whether the current first-time `SessionSetupStrip` prominence and goal/setup cards need any final Overview-level copy/spacing polish before marking Phase 5 complete.\n', '\n', 'stale phase 5 next step'),
              ('## Remaining renovation phases\n\nThe exact implementation boundaries may move as the live code is inspected, but preserve this order of intent unless a correctness issue requires interruption.', '## Completed renovation phases\n\nThe following phase descriptions preserve the intent that guided implementation; current status is authoritative over their original future-tense wording.' , 'remaining phases heading'),
              ('### Phase 6 — Session Analysis', '### Phase 6 — Session Analysis — DONE', 'phase 6 status'),
              ('### Phase 7 — Session Deep Dive', '### Phase 7 — Session Deep Dive — DONE', 'phase 7 status'),
              ('### Phase 8 — Progress / longitudinal analytics', '### Phase 8 — Progress / longitudinal analytics — DONE', 'phase 8 status'),
              ('### Phase 9 — Goals', '### Phase 9 — Goals — DONE', 'phase 9 status'),
              ('### Phase 10 — Compare / leaderboard', '### Phase 10 — Compare / leaderboard — DONE', 'phase 10 status'),
              ('### Phase 11 — Upload and session enrichment', '### Phase 11 — Upload and session enrichment — DONE', 'phase 11 status'),
              ('### Phase 12 — Video experience', '### Phase 12 — Video experience — DONE', 'phase 12 status'),
              ('### Phase 13 — Coach workspace', '### Phase 13 — Coach workspace — DONE', 'phase 13 status'),
              ('### Phase 14 — Admin, research, help and public/supporting pages', '### Phase 14 — Admin, research, help and public/supporting pages — DONE', 'phase 14 status'),
              ('### Phase 15 — Final consolidation and release hardening\n\n- remove dead components/legacy compatibility paths once no consumers remain;\n- consolidate repeated presentation primitives;\n- accessibility/responsive pass;\n- terminology/copy consistency;\n- empty/error/loading states;\n- full static/unit/browser/live-data audit;\n- update documentation to describe the final architecture rather than historical migrations/bridges that are no longer relevant.', '### Phase 15 — Final consolidation and release hardening — FINAL VERIFICATION\n\n- remove dead components/legacy compatibility paths once no consumers remain;\n- consolidate repeated presentation primitives where that reduces real maintenance cost;\n- accessibility/responsive pass;\n- terminology/copy consistency;\n- empty/error/loading states;\n- full static/unit/browser/live-data audit;\n- update documentation to describe the final architecture rather than historical migrations/bridges that are no longer relevant.\n\nCurrent checkpoint: consumer-backed dead-code and obsolete-route cleanup is complete; concrete mutation-recovery, copy-consistency, navigation, modal, upload-feedback, and keyboard-accessibility defects found in the bounded hardening sweep have been corrected. Small local focus helpers were deliberately not extracted into a shared abstraction because the interaction ownership differs and extraction would add coupling without meaningful maintenance benefit. Required CI is at 0 Svelte errors / 0 warnings with 128/128 tests and a passing production build. Final completion is waiting only on the newest independent live/browser checks and final PR/diff sign-off.', 'phase 15 checkpoint'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RENOVATION_ROADMAP.md
          git diff --cached --check
          git commit -m "docs: bring renovation roadmap to Phase 15"
          git push origin HEAD:phase15-release-hardening-audit
