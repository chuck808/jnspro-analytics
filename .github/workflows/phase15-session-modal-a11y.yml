name: Phase 15 session modal accessibility patch

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-session-modal-a11y.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Patch modal wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/components/SessionComparisonModal.svelte')
          text = path.read_text()
          old = '''\t<div
\t\tclass="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 p-4"
\t\trole="button"
\t\ttabindex="0"
\t\tonclick={(e) => e.target === e.currentTarget && close()}
\t\tonkeydown={(e) =>
\t\t\t(e.key === 'Escape' || (e.key === 'Enter' && e.target === e.currentTarget)) && close()}
\t\taria-label="Close comparison modal"
\t>
\t\t<div
\t\t\tclass="my-8 w-full max-w-5xl"
\t\t\trole="dialog"
\t\t\ttabindex="-1"
\t\t\taria-modal="true"
\t\t\taria-labelledby="comparison-title"
\t\t\tonclick={(e) => e.stopPropagation()}
\t\t\tonkeydown={(e) => e.stopPropagation()}
\t\t>'''
          new = '''\t<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 p-4">
\t\t<button
\t\t\ttype="button"
\t\t\ttabindex="-1"
\t\t\tclass="absolute inset-0 cursor-default"
\t\t\taria-label="Close session comparison"
\t\t\tonclick={close}
\t\t></button>
\t\t<div
\t\t\tclass="relative my-8 w-full max-w-5xl"
\t\t\trole="dialog"
\t\t\ttabindex="-1"
\t\t\taria-modal="true"
\t\t\taria-labelledby="comparison-title"
\t\t\tonkeydown={(e) => e.key === 'Escape' && close()}
\t\t>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one modal wrapper match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/SessionComparisonModal.svelte
          git diff --cached --check
          git commit -m "fix: correct session comparison modal semantics"
          git push origin HEAD:phase15-release-hardening-audit
