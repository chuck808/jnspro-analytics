name: Phase 15 session modal accessibility patch

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-session-modal-a11y.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Patch modal wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/SessionComparisonModal.svelte')
          text = path.read_text()
          old = "\t<div\n\t\tclass=\"fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 p-4\"\n\t\trole=\"button\"\n\t\ttabindex=\"0\"\n\t\tonclick={(e) => e.target === e.currentTarget && close()}\n\t\tonkeydown={(e) =>\n\t\t\t(e.key === 'Escape' || (e.key === 'Enter' && e.target === e.currentTarget)) && close()}\n\t\taria-label=\"Close comparison modal\"\n\t>\n\t\t<div\n\t\t\tclass=\"my-8 w-full max-w-5xl\"\n\t\t\trole=\"dialog\"\n\t\t\ttabindex=\"-1\"\n\t\t\taria-modal=\"true\"\n\t\t\taria-labelledby=\"comparison-title\"\n\t\t\tonclick={(e) => e.stopPropagation()}\n\t\t\tonkeydown={(e) => e.stopPropagation()}\n\t\t>"
          new = "\t<div class=\"fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 p-4\">\n\t\t<button\n\t\t\ttype=\"button\"\n\t\t\ttabindex=\"-1\"\n\t\t\tclass=\"absolute inset-0 cursor-default\"\n\t\t\taria-label=\"Close session comparison\"\n\t\t\tonclick={close}\n\t\t></button>\n\t\t<div\n\t\t\tclass=\"relative my-8 w-full max-w-5xl\"\n\t\t\trole=\"dialog\"\n\t\t\ttabindex=\"-1\"\n\t\t\taria-modal=\"true\"\n\t\t\taria-labelledby=\"comparison-title\"\n\t\t\tonkeydown={(e) => e.key === 'Escape' && close()}\n\t\t>"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one modal wrapper match, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/SessionComparisonModal.svelte
          git diff --cached --check
          git commit -m "fix: correct session comparison modal semantics"
          git push origin HEAD:phase15-release-hardening-audit
