name: Phase 15 feedback focus return patch

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-feedback-focus-return.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Complete feedback dialog focus semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/FeedbackButton.svelte')
          text = path.read_text()
          replacements = [
              ("\tlet isSuccess = $state(false);\n", "\tlet isSuccess = $state(false);\n\tlet feedbackButton: HTMLButtonElement;\n", 'trigger ref'),
              ("\tfunction closeModal() {\n\t\tisOpen = false;\n", "\tfunction closeModal() {\n\t\tisOpen = false;\n\t\tfeedbackButton?.focus();\n", 'focus return'),
              ("<button class=\"feedback-btn\" onclick={openModal} title=\"Report an issue or send feedback\">", "<button\n\tbind:this={feedbackButton}\n\tclass=\"feedback-btn\"\n\tonclick={openModal}\n\taria-label=\"Report an issue or send feedback\"\n\ttitle=\"Report an issue or send feedback\"\n>", 'trigger label'),
              ("\t\t\t\t<div class=\"success-message\">", "\t\t\t\t<div role=\"status\" class=\"success-message\">", 'success status'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/FeedbackButton.svelte
          git diff --cached --check
          git commit -m "fix: complete feedback dialog focus flow"
          git push origin HEAD:phase15-release-hardening-audit
