name: Phase 15 feedback backdrop button patch

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-feedback-backdrop-button.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Replace clickable backdrop with real button
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/FeedbackButton.svelte')
          text = path.read_text()
          replacements = [
              ("\n\tfunction handleBackdropClick(event: MouseEvent) {\n\t\tif (event.target === event.currentTarget) {\n\t\t\tcloseModal();\n\t\t}\n\t}\n", "", 'obsolete backdrop handler'),
              ("{#if isOpen}\n\t<div class=\"modal-backdrop\" onclick={handleBackdropClick}>\n\t\t<div\n\t\t\tclass=\"modal-content\"\n\t\t\tonclick={(e) => e.stopPropagation()}\n", "{#if isOpen}\n\t<div class=\"modal-backdrop\">\n\t\t<button\n\t\t\ttype=\"button\"\n\t\t\tclass=\"modal-backdrop-dismiss\"\n\t\t\tonclick={closeModal}\n\t\t\taria-label=\"Close feedback dialog\"\n\t\t\ttabindex=\"-1\"\n\t\t></button>\n\t\t<div\n\t\t\tclass=\"modal-content\"\n", 'modal wrapper'),
              ("\n\t.modal-content {\n\t\tbackground: #131010;", "\n\t.modal-backdrop-dismiss {\n\t\tposition: absolute;\n\t\tinset: 0;\n\t\tborder: 0;\n\t\tbackground: transparent;\n\t\tcursor: default;\n\t}\n\n\t.modal-content {\n\t\tposition: relative;\n\t\tz-index: 1;\n\t\tbackground: #131010;", 'backdrop button styles'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/FeedbackButton.svelte
          git diff --cached --check
          git commit -m "fix: use real feedback modal backdrop control"
          git push origin HEAD:phase15-release-hardening-audit
