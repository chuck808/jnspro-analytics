name: Phase 14 docs support email fix

on:
  push:
    branches:
      - phase14-help-public-audit

permissions:
  contents: write

jobs:
  patch-docs-support-email:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase14-help-public-audit

      - name: Replace obsolete docs support email only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/docs/+layout.svelte')
          text = path.read_text()
          old = 'support@appgatepro.com'
          new = 'support@jnsprosystems.com'
          if text.count(old) != 2:
              raise SystemExit(f'expected obsolete email twice in docs layout, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit isolated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/docs/+layout.svelte'
          git commit -m 'fix: update docs support email'
          git push origin HEAD:phase14-help-public-audit
