name: Phase 15 feedback modal a11y patch

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-feedback-modal-a11y.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Harden feedback modal keyboard semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/FeedbackButton.svelte')
          text = path.read_text()
          replacements = [
              ("\tfunction handleKeyDown(event: KeyboardEvent) {\n\t\tif (event.key === 'Escape' || event.key === 'Enter') {\n\t\t\tcloseModal();\n\t\t}\n\t}\n", "\tfunction focusOnMount(node: HTMLElement) {\n\t\tnode.focus();\n\t}\n\n\tfunction handleKeyDown(event: KeyboardEvent) {\n\t\tif (event.key === 'Escape') {\n\t\t\tcloseModal();\n\t\t}\n\t}\n", 'keyboard handler'),
              ("\t<div\n\t\tclass=\"modal-backdrop\"\n\t\tonclick={handleBackdropClick}\n\t\tonkeydown={handleKeyDown}\n\t\trole=\"button\"\n\t\ttabindex=\"-1\"\n\t>\n", "\t<div class=\"modal-backdrop\" onclick={handleBackdropClick}>\n", 'backdrop semantics'),
              ("\t\t<div\n\t\t\tclass=\"modal-content\"\n\t\t\tonclick={(e) => e.stopPropagation()}\n\t\t\tonkeydown={(e) => e.stopPropagation()}\n\t\t\trole=\"dialog\"\n\t\t\taria-modal=\"true\"\n\t\t\ttabindex=\"0\"\n\t\t>\n", "\t\t<div\n\t\t\tclass=\"modal-content\"\n\t\t\tonclick={(e) => e.stopPropagation()}\n\t\t\tonkeydown={handleKeyDown}\n\t\t\trole=\"dialog\"\n\t\t\taria-modal=\"true\"\n\t\t\taria-labelledby=\"feedback-modal-title\"\n\t\t\ttabindex=\"-1\"\n\t\t\tuse:focusOnMount\n\t\t>\n", 'dialog semantics'),
              ("\t\t\t\t\t\t<h2 class=\"modal-title\">Report an Issue</h2>", "\t\t\t\t\t\t<h2 id=\"feedback-modal-title\" class=\"modal-title\">Report an Issue</h2>", 'dialog label'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/FeedbackButton.svelte
          git diff --cached --check
          git commit -m "fix: harden feedback modal keyboard access"
          git push origin HEAD:phase15-release-hardening-audit
