name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Format-valid placeholders only — satisfy $env/static/* and validateEnv()
  # for typecheck/lint/test/build. No real credentials are used in CI; live
  # Supabase calls are not exercised by these steps.
  PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_0000000000
  SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder_00000000000000
  DEVICE_INGEST_SECRET: ci-placeholder-secret-not-for-production-use-32c

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Not a required check yet: the codebase currently has ~980 pre-existing
  # ESLint errors and ~390 unformatted files, accumulated before this
  # workflow existed. Fixing that at scale (particularly 130+
  # svelte/no-navigation-without-resolve sites) needs its own reviewed pass,
  # not a blind bulk autofix. This job stays informational (green tick /
  # red X on the commit, doesn't block merges) until that cleanup lands —
  # then flip it into the `verify` job as a hard gate.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
