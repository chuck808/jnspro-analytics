name: Phase 15 feedback dialog state follow-up

on:
  push:
    branches: [phase15-release-hardening-audit]
    paths:
      - .github/workflows/phase15-feedback-state-followup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-release-hardening-audit
      - name: Make Feedback dialog binding reactive
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/FeedbackButton.svelte')
          text = path.read_text()
          old = '\tlet modalContent: HTMLDivElement;\n'
          new = '\tlet modalContent = $state<HTMLDivElement>();\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one modalContent declaration, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit reactive binding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/FeedbackButton.svelte
          git diff --cached --check
          git commit -m "fix: make Feedback dialog binding reactive"
          git push origin HEAD:phase15-release-hardening-audit
